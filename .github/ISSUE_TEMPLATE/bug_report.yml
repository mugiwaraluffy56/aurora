name: Bug report
description: Report a reproducible Aurora issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Samsung Galaxy S24 FE
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Android 15 / API 35
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset
      placeholder: Cardboard, Daydream, custom shell, none
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library
        - Playback
        - VR rendering
        - Head tracking
        - Settings
        - Packaging/install
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Import a video...
        2. Enter VR...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Media details
      description: Codec, resolution, frame rate, container, and whether it is mono/SBS/over-under/180/360 if known.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
