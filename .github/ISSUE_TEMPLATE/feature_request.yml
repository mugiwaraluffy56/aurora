name: Feature request
description: Propose an Aurora feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should Aurora do?
    validations:
      required: true
  - type: dropdown
    id: vr-impact
    attributes:
      label: VR impact
      options:
        - No VR impact
        - Improves comfort
        - Improves rendering quality
        - Improves input/control
        - Adds headset or projection support
        - Unknown
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: notes
    attributes:
      label: Additional context
